version: '3.8'

services:
  # ================================
  # ZOOKEEPER
  # ================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  # ================================
  # KAFKA BROKER
  # ================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bigdata-net
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ================================
  # SPARK MASTER
  # ================================
  spark-master:
    image: spark:3.5.3
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master Port
    networks:
      - bigdata-net
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./data_lake:/opt/data_lake
      - spark-master-logs:/opt/bitnami/spark/logs

  # ================================
  # SPARK WORKER 1
  # ================================
  spark-worker-1:
    image: spark:3.5.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"   # Worker 1 Web UI
    networks:
      - bigdata-net
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./data_lake:/opt/data_lake
      - spark-worker-1-logs:/opt/bitnami/spark/logs

  # ================================
  # SPARK WORKER 2
  # ================================
  spark-worker-2:
    image: spark:3.5.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8081"   # Worker 2 Web UI
    networks:
      - bigdata-net
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./data_lake:/opt/data_lake
      - spark-worker-2-logs:/opt/bitnami/spark/logs

    # ================================
  # APACHE ZEPPELIN (Notebooks)
  # ================================
  zeppelin:
    image: apache/zeppelin:0.11.0
    container_name: zeppelin
    depends_on:
      - spark-master
    ports:
      - "8083:8080"   # Zeppelin Web UI
    environment:
      - ZEPPELIN_ADDR=0.0.0.0
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_HOME=/opt/spark
    networks:
      - bigdata-net
    volumes:
      - zeppelin-notebooks:/opt/zeppelin/notebook
      - ./data_lake:/opt/data_lake
      - /opt/spark:/opt/spark   # mount Spark into Zeppelin container


  # ================================
  # ELASTICSEARCH
  # ================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - bigdata-net
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # ================================
  # LOGSTASH
  # ================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    depends_on:
      - elasticsearch
    ports:
      - "5000:5000"   # Input TCP
      - "9600:9600"   # Monitoring API
    environment:
      - "LS_JAVA_OPTS=-Xms1g -Xmx1g"
    networks:
      - bigdata-net
    volumes:
      - ./elk/logstash/pipelines:/usr/share/logstash/pipeline
      - ./data_lake:/opt/data_lake
      - logstash-data:/usr/share/logstash/data

  # ================================
  # KIBANA
  # ================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - bigdata-net
    volumes:
      - kibana-data:/usr/share/kibana/data

# ================================
# NETWORKS
# ================================
networks:
  bigdata-net:
    driver: bridge
    name: bigdata-net

# ================================
# VOLUMES PERSISTANTS
# ================================
volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  spark-master-logs:
  spark-worker-1-logs:
  spark-worker-2-logs:
  zeppelin-notebooks:
  elasticsearch-data:
  logstash-data:
  kibana-data:
